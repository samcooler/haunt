; One generic firmware for every ESP32 node. Flash it once per board; after that
; the board's job (LED pin and count, inputs, thresholds) comes from devices.yaml
; over MQTT, and new firmware arrives by OTA (`haunt ota <node> <file>`).
;
;   pio run -e esp32 -t upload      classic ESP32 / WROOM (D1 mini 32, DevKit)
;   pio run -e esp32s3 -t upload    ESP32-S3 (4 MB flash, 2 MB PSRAM)
;   pio run -e esp32c3 -t upload    ESP32-C3 (Seeed XIAO)

[platformio]
default_envs = esp32, esp32s3, esp32c3
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Pinned: an unpinned library changes under you between builds on different days.
lib_deps =
	knolleary/PubSubClient @ 2.8
	bblanchon/ArduinoJson @ 7.2.1
	adafruit/Adafruit NeoPixel @ 1.12.3
build_flags =
	-D HAUNT_FW='"0.1.0"'
; Two app slots so OTA can always fall back to the image that was running.
board_build.partitions = min_spiffs.csv

[env:esp32]
board = wemos_d1_mini32
build_flags =
	${env.build_flags}
	-D HAUNT_ENV='"esp32"'
; CH340 boards: asserting DTR/RTS on open holds the chip in reset.
monitor_dtr = 0
monitor_rts = 0

[env:esp32s3]
board = esp32s3_4mb_2mbpsram
build_flags =
	${env.build_flags}
	-D HAUNT_ENV='"esp32s3"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM

[env:esp32c3]
board = seeed_xiao_esp32c3
build_flags =
	${env.build_flags}
	-D HAUNT_ENV='"esp32c3"'
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
