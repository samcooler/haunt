# Words and sound levels: what the show says and how loud, kept out of show.py so
# they can be edited on site. Saving this file reloads the show.

# How each colour looks, on ropes, extractors and the band (RRGGBB).
colors:
  red: "#FF3B30"
  blue: "#0A84FF"
  green: "#34C759"
  yellow: "#FFD60A"
  orange: "#FF9500"
  purple: "#BF5AF2"

# Text over the Overlord's video. seconds: how long it stays; cooldown: at most this often.
messages:
  purple_inactive:                  # a purple pull in a round
    text: 'PURPLE LEVERS ARE INACTIVE\NDURING PRIMARY EXTRACTION PHASE'
    seconds: 4
    cooldown: 10
  pump:                             # every 30 s while a game is on
    text: "PUMP THE LEVERS UP AND DOWN"
    seconds: 4
  afterword:                        # over the end of the jailbreak video
    text: "Thanks for playing!"
    seconds: 29

# The diorama's television: a channel is a list of slides it cycles through.
television:
  idle:
    - {text: "STAY TUNED", bg: "#C81E1E", fg: "#FFF2C0", seconds: 5}
  janis:
    - {text: "A message from Janis", bg: "#000000", fg: "#FFD400", seconds: 6}
  paradise:
    - {text: "The spirits are resting.\nPlease do not disturb them.", bg: "#0A3D2E", fg: "#E8FFF4", seconds: 8}
  dark: []

# The sign for the queue outside.
sign:
  enter: [{text: "Avoid purple\ncontamination", bg: "#3A0A4A", fg: "#FFFFFF"}]
  wait: [{text: "Avoid purple\ncontamination", bg: "#3A0A4A", fg: "#FFFFFF"}]
  closed: [{text: "Closed", bg: "#101010", fg: "#C0C0C0"}]

# Volume multiplier per cue (1 = as the file is). A * key covers every cue it matches;
# an exact name wins over a pattern.
gain:
  audio_loop_idle: 0.89
  audio_once_steam: 0.6
  audio_once_component_powerdown: 1.17
  audio_once_encouragement: 1.45
  video_once_janis_*: 2             # every Janis clip, +6 dB

# A loop that starts quiet and grows: `start` of its volume, +`step` every `every` seconds.
ramp:
  audio_loop_spirit_distress: {start: 0.5, step: 0.1, every: 10}
