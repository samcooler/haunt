# Everything worth tuning on site. Each one is a slider/picker in the console,
# changes apply live, and tuned values survive restarts (`haunt params` shows them).

idle_color: "#2030ff"
awake_color: "#ff8020"
win_color: "#40ff60"
brightness: {value: 0.6, min: 0.05, max: 1, step: 0.05}
breathe_speed: {value: 0.3, min: 0.05, max: 2, step: 0.05, unit: Hz}
pulls_to_win: {value: 5, min: 1, max: 20}
awake_timeout: {value: 30, min: 5, max: 120, unit: s, label: "Give up after"}
celebrate_for: {value: 8, min: 2, max: 30, unit: s}
